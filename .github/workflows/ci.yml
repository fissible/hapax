name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # `go test -race ./...` measures 9m24s on ubuntu, of which internal/workflow
    # is 7m9s: nearly every test there builds a corpus, indexes it and crafts a
    # release. At 10 the margin was 36 seconds and one slice's fixtures spent it.
    #
    # The JOB timeout was raised then and `go test`'s own was not, so the binding
    # limit stayed Go's default 10m PER PACKAGE — a number nobody chose. #132/#134
    # spent what was left of it: measured on one machine under -race,
    # internal/workflow is 300.9s on main and 362.8s with that slice, +20.6%,
    # which crossed 10m on the macOS runner and produced a goroutine dump rather
    # than a failing assertion.
    #
    # -timeout is now explicit and below the job's, so a package that really does
    # hang still dumps its goroutines instead of being killed without one. 20m is
    # roughly twice what internal/workflow costs on the slower runner, which still
    # catches a genuine hang; the job gets 30 so the binary's dump comes first.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25'
      - run: go test -race -timeout 20m ./...

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25'
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
